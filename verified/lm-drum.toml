# LM DRUM — descriptor facts.
#
# Sources:
#   1. Behringer LM DRUM user manual p. 24 (note map) and p. 27 (MIDI CCs).
#   2. Measurements on an LM DRUM running firmware 1.1.7: the 0x75 -> 0x76
#      settings block, its 108-byte layout, and the SysEx packets that change it.
#      Transcript: verified/lm-drum-measurements.md.
#
# The public documentation has no SysEx packet table for this device, so only
# facts that were measured are included here. Parameters whose purpose could not
# be established from the documentation are named neutrally.



notes = [
    "Measured on firmware 1.1.7: 0x75 -> 0x76 with a 108-byte block. Block offsets were mapped one packet at a time by writing, reading and restoring.",
    "ACK codes are per packet: silence means unknown packet or sub-index, 01 00 00 means applied, and 01 00 01 is both a rejection and the answer to every applied 0x0E write.",
    "Two-field frame: 28 <a> <b> writes block offsets 9 and 10 in one message; it is not a sub-index container.",
    "2C <sub> <value> writes block offsets 32-34; the value is a 0-based voice index in the manual voice order.",
    "1A <value> writes block offset 6 (clock rate); on firmware 1.1.7 only 99-104 are accepted.",
    "74 0A <value> writes block offset 54 (sample mode); only 0 and 1 are accepted.",
    "0E sub 01 writes TX then RX (offsets 8/7); other sub values tested (2-5) wrote TX only. No writer found for the USB in/out channels at offsets 11/12.",
    "74 <sub> <value> addresses single switches: sub 09 -> offset 35, 0B -> offset 2, 0C -> offset 31.",
    "76 is not accepted as a bulk write: 76 <108 bytes> produced no ACK and no block change.",
    "Note-map slots (packet 29) are 16 bytes at offsets 14-29; the voice behind each slot is not published, so slots are named by position.",
    "Settings persist across a power cycle: accent threshold written 109 -> 100 survived a power-cycle; no commit command is needed.",
    "Parameters tagged vendor-named have a measured wire address and a name taken from the vendor configuration; their meaning is not behaviourally confirmed.",
]

limits = [
    "The public manual has no SysEx packet table: only measured packets and the documented CCs are exposed.",
    "No write frame is known for the USB in/out channel fields (offsets 11/12), clock polarity, the flags at 55/72/73, or the voice-channel map at 56-71.",
    "Sequencer patterns, samples and DFU need their own investigation.",
    "CC writes have no read-back: the sliders show what was sent, not what the instrument stored.",
    "Behavioural effects of end mode, MIDI through and the trigger-output indices are untested.",
]

rejected = []

