    "Bass drum",
    "Snare",
    "Sidestick",
    "Closed hi-hat",
    "Open hi-hat",
    "Hi tom",
    "Mid tom",
    "Low tom",
    "Ride",
    "Crash",
    "Cabasa",
    "Tambourine",
    "High conga",
    "Low conga",
    "Cowbell",
    "Claps",
]

[device]
id = "lm-drum"
name = "LM DRUM"
model = [0x00, 0x01, 0x28]
family = 3
port_hint = "LM DRUM"
styles = ["packet-direct"]
channel_param = "channel.rx"
reject_codes = []

[device.read]
opcode = 0x75
reply = 0x76
block_len = 108



