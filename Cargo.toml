[workspace]
members = ["crates/core", "crates/poly-d", "crates/lm-drum", "xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
eframe = { version = "0.37", default-features = false, features = [
    "glow",
    "default_fonts",
    "wayland",
    "x11",
] }
midir = "0.10"

[profile.release]
opt-level = 2
